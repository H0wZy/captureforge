schema_version = "1.0.0"

id = "captureforge"
version = "0.1.0"
name = "CaptureForge"
tagline = "Face and body mocap from video: ARKit shapes, Humanoid clips"
maintainer = "H0wZy"
website = "https://howzysolutions.com"
type = "add-on"
tags = ["Animation", "Rigging"]

blender_version_min = "4.4.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read mocap and video files; write clips, reports and FBX"
network = "Localhost face data; model download only after you confirm"

[build]
paths_exclude_pattern = ["__pycache__/", ".*"]
